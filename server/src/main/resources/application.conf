ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.conservatio.server.ApplicationKt.module ]
    }
}

database {
    url = ${DATABASE_URL}
    user = ${DATABASE_USER}
    password = ${DATABASE_PASSWORD}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "conservatio"
    audience = "conservatio-app"
    realm = "Conservatio"
    expiration = 86400000
}

storage {
    path = "/data/conservatio/images"
    path = ${?STORAGE_PATH}
    maxFileSize = 52428800
    # Default quota per user: 2 GB (in bytes). Can override via env.
    defaultQuotaBytes = 2147483648
    defaultQuotaBytes = ${?STORAGE_DEFAULT_QUOTA_BYTES}
}

oauth {
    google {
        clientId = ${?GOOGLE_CLIENT_ID}
        clientSecret = ${?GOOGLE_CLIENT_SECRET}
    }
    linkedin {
        clientId = ${?LINKEDIN_CLIENT_ID}
        clientSecret = ${?LINKEDIN_CLIENT_SECRET}
    }
    apple {
        clientId = ${?APPLE_SERVICES_ID}     # Services ID, e.g. "dev.peterdsp.conservatio.web"
        teamId = ${?APPLE_TEAM_ID}
        keyId = ${?APPLE_KEY_ID}
        # PEM private key contents (the body of the .p8 file, including the
        # BEGIN/END lines). Newlines must be preserved.
        privateKey = ${?APPLE_PRIVATE_KEY}
    }
    github {
        clientId = ${?GITHUB_CLIENT_ID}
        clientSecret = ${?GITHUB_CLIENT_SECRET}
    }
}
